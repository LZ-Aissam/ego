name: Sauvegarde hebdomadaire

# Chaque lundi à 5 h (Paris) : export des données de jeu de la production, gardé 90 jours dans les artefacts
# privés du dépôt (Actions → Sauvegarde hebdomadaire → ego-export). Lançable à la main depuis l'onglet Actions.
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock puppeteer@23.11.1
      - name: Export de la production
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: node .github/scripts/backup-export.mjs ego-export-$(date +%Y-%m-%d).json
      - uses: actions/upload-artifact@v4
        with:
          name: ego-export
          path: ego-export-*.json
          retention-days: 90
